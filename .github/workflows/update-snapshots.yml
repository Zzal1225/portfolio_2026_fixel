# 화면 비교 기준 스크린샷 만들기/갱신(수동 실행). 리눅스에서 찍어 e2e/__screenshots__/에 커밋한다.
# 의도한 화면 변경 뒤에만 돌린다: Actions 탭 → Update visual snapshots → Run workflow (또는 gh workflow run).
name: Update visual snapshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/visual.spec.ts --project=chromium-pc --project=chromium-mobile --update-snapshots
        env:
          VISUAL: '1'
      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/__screenshots__
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "test: 화면 비교 기준 스크린샷 갱신(리눅스 CI)"
          git push
