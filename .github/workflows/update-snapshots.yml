# 화면 비교 기준 스크린샷 만들기/갱신(수동 실행). CI와 같은 Playwright 이미지에서 찍어 e2e/__screenshots__/에 커밋한다.
# 의도한 화면 변경 뒤에만 돌린다: Actions 탭 → Update visual snapshots → Run workflow (또는 gh workflow run).
# 두 잡으로 나눈 이유: 찍기는 CI와 같은 컨테이너여야 글꼴 렌더링이 같고, 커밋은 git이 확실히 있는 러너에서 한다.
name: Update visual snapshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shoot:
    runs-on: ubuntu-latest
    # 브라우저·리눅스 의존 패키지가 미리 깔린 Playwright 공식 이미지(버전은 package-lock의 @playwright/test와 같게).
    # 왜: 러너에서 `playwright install --with-deps`가 apt 미러 문제로 자주 멈췄다(11-10 다섯 번, 재시도·시간 제한으로도 해결 안 됨).
    # 이미지에서는 apt 내려받기 자체가 없다. @playwright/test를 올리면 이 태그도 같이 올린다.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright test e2e/visual.spec.ts --project=chromium-pc --project=chromium-mobile --update-snapshots
        env:
          VISUAL: '1'
      - uses: actions/upload-artifact@v5
        with:
          name: snapshots
          path: e2e/__screenshots__/
          retention-days: 1

  commit:
    runs-on: ubuntu-latest
    needs: shoot
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: snapshots
          path: e2e/__screenshots__/
      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/__screenshots__
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "test: 화면 비교 기준 스크린샷 갱신(Playwright 이미지)"
          git push
