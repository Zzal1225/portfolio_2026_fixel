# 화면 비교 기준 스크린샷 만들기/갱신(수동 실행). 리눅스에서 찍어 e2e/__screenshots__/에 커밋한다.
# 의도한 화면 변경 뒤에만 돌린다: Actions 탭 → Update visual snapshots → Run workflow (또는 gh workflow run).
name: Update visual snapshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # 리눅스 패키지 내려받기가 가끔 멈춘다(11-10 네 번 관찰: 미러에서 패키지 하나가 응답 없음).
      # ① apt에 내려받기 시간 제한·재시도를 걸어 멈추지 않게 하고 ② 그래도 실패하면 남은 apt 프로세스·잠금을 치우고 다시(최대 3번).
      # 이전 방식(timeout으로 npx만 끊기)은 sudo apt-get이 살아남아 잠금을 쥐고 있어 재시도가 전부 실패했다.
      - name: Install Playwright browsers (retry)
        run: |
          printf 'Acquire::Retries "5";
Acquire::http::Timeout "20";
Acquire::https::Timeout "20";
' | sudo tee /etc/apt/apt.conf.d/99ci-timeouts
          for i in 1 2 3; do
            timeout 240 npx playwright install --with-deps chromium && exit 0
            echo "::warning::playwright install attempt $i stalled or failed, cleaning up apt and retrying"
            sudo pkill -9 -f 'apt-get|dpkg' || true
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock
            sudo dpkg --configure -a || true
          done
          exit 1
        timeout-minutes: 14
      - run: npx playwright test e2e/visual.spec.ts --project=chromium-pc --project=chromium-mobile --update-snapshots
        env:
          VISUAL: '1'
      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/__screenshots__
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "test: 화면 비교 기준 스크린샷 갱신(리눅스 CI)"
          git push
