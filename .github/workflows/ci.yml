# CI: lint · typecheck · 단위 테스트 · 빌드 · E2E(크로미움 PC·모바일, WebKit PC).
# Lighthouse CI·WebKit·화면 비교는 step2(기획서 기능 범위).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 수동 실행(예: 화면 비교 기준을 갱신한 뒤 비교가 통과하는지 확인)
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      # 리눅스 패키지 내려받기가 가끔 멈춘다(11-10 네 번 관찰: 미러에서 패키지 하나가 응답 없음).
      # ① apt에 내려받기 시간 제한·재시도를 걸어 멈추지 않게 하고 ② 그래도 실패하면 남은 apt 프로세스·잠금을 치우고 다시(최대 3번).
      # 이전 방식(timeout으로 npx만 끊기)은 sudo apt-get이 살아남아 잠금을 쥐고 있어 재시도가 전부 실패했다.
      - name: Install Playwright browsers (retry)
        run: |
          echo 'Acquire::Retries "5"; Acquire::http::Timeout "20"; Acquire::https::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/99ci-timeouts
          for i in 1 2 3; do
            timeout 240 npx playwright install --with-deps chromium webkit && exit 0
            echo "::warning::playwright install attempt $i stalled or failed, cleaning up apt and retrying"
            sudo pkill -9 -f 'apt-get|dpkg' || true
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock
            sudo dpkg --configure -a || true
          done
          exit 1
        timeout-minutes: 14
      # 화면 비교 기준(e2e/__screenshots__)이 커밋돼 있으면 함께 비교한다
      - run: npm run test:e2e
        env:
          VISUAL: ${{ hashFiles('e2e/__screenshots__/**') != '' && '1' || '' }}
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  lighthouse:
    # 첫 화면 Lighthouse(모바일). 성능·접근성 0.9 미만이면 실패(lighthouserc.json)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # 인트로가 14초라 3회 측정은 10분 가까이 걸린다. CI는 1회(추세 확인용), 정식 기록은 로컬 3회 중앙값(docs/performance.md)
      - run: npx lhci autorun --collect.numberOfRuns=1
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports/
          retention-days: 14
