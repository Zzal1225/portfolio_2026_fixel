# CI: lint · typecheck · 단위 테스트 · 빌드 · E2E(크로미움 PC·모바일, WebKit PC).
# Lighthouse는 별도 잡(러너 기본 Chrome 사용, 컨테이너 아님).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 수동 실행(예: 화면 비교 기준을 갱신한 뒤 비교가 통과하는지 확인)
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # 브라우저·리눅스 의존 패키지가 미리 깔린 Playwright 공식 이미지(버전은 package-lock의 @playwright/test와 같게).
    # 왜: 러너에서 `playwright install --with-deps`가 apt 미러 문제로 자주 멈췄다(11-10 다섯 번, 재시도·시간 제한으로도 해결 안 됨).
    # 이미지에서는 apt 내려받기 자체가 없다. @playwright/test를 올리면 이 태그도 같이 올린다.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      # 화면 비교 기준(e2e/__screenshots__)이 커밋돼 있으면 함께 비교한다
      - run: npm run test:e2e
        env:
          VISUAL: ${{ hashFiles('e2e/__screenshots__/**') != '' && '1' || '' }}
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  lighthouse:
    # 첫 화면 Lighthouse(모바일). 성능·접근성 0.9 미만이면 실패(lighthouserc.json)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # 인트로가 14초라 3회 측정은 10분 가까이 걸린다. CI는 1회(추세 확인용), 정식 기록은 로컬 3회 중앙값(docs/performance.md)
      - run: npx lhci autorun --collect.numberOfRuns=1
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports/
          retention-days: 14
